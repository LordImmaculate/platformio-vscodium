name: Publish to OpenVSX

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build extension
        run: npm run build
      
      - name: Install vsce
        run: npm install -g @vscode/vsce
      
      - name: Publish to OpenVSX
        run: vsce publish --pat ${{ secrets.OPENVSX_TOKEN }} --registryUrl https://open-vsx.org
